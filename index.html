<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Water</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.0/nouislider.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.0/nouislider.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="text-align: center;">Water consumption and prices in New York City</h1>
    <!-- <p style="text-align: center;">Ce projet permet d'explorer les données fournis par la municipalité de new york sur la consommation et les charges mensuelles liées à l'eau entre 2013 et 2023. Il est réalisé dans le cadre du cours "Visualisation interactive de données" à l'École Centrale de Lyon, supervisé par M. Romain Vuillemot.</p>
    <p style="text-align: center;">
        <a href="Prototype.jpg" target="_blank">Voir le prototype</a>
    </p> -->
    <div id="controls-container">
        <div id="slider-container">
            <div id="date-slider"></div>
            <p id="date-display"></p>
        </div>
        <div id="selection-container">
            <label for="consumption-select">Volume unit :</label>
            <select id="consumption-select">
                <option value="Consumption (HCF)">HCF</option>
                <option value="Consumption (m3)">m3</option>
            </select>
        </div>
    </div>
    
    <div class="container-flex">
        <div id="NYCMap"></div>
        <div class="side-vizs">
            <div id="scorecards">
                <div class="scorecard" id="water-consumption">💧 Comsumption \n 0 m³</div>
                <div class="scorecard" id="total-price">💰 Total Charges \n $0</div>
                <div class="scorecard" id="price-per-unit">📏 Price/m³ \n $0</div>   
            </div>
            <div id="LineChart1"></div>
            <div id="LineChart2"></div>
        </div>
    </div>

    <div class="MetricChoice">
        <label><input type="radio" name="option" value="Consumption" checked> Consumption</label>
        <label><input type="radio" name="option" value="Charges"> Charges</label>
    </div>

    <div class="container-flex2">
        <div id="areachart-container"></div>
        <div id="treemap-container"></div>
    </div>
    
    <script src="app.js" ></script>
</body>
</html>
