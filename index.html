<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Water</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.0/nouislider.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.5.0/nouislider.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="text-align: center; font-size: 1.5em;">Water consumption and prices in New York City</h1>
    <div id="controls-container">
        <div id="slider-container">
            <div id="date-slider"></div>
            <p id="date-display"></p>
        </div>
        <div id="selection-container">
            <label for="consumption-select">Volume unit :</label>
            <select id="consumption-select">
                <option value="Consumption (HCF)">HCF</option>
                <option value="Consumption (m3)">m3</option>
            </select>
        </div>
    </div>
    
    <div class="container-flex">
        <div id="separator-viz"></div>
        <div id="NYCMap"></div>
        <div id="separator-viz2"></div>
        <div class="side-vizs">
            <div id="scorecards">
                <div class="scorecard" id="water-consumption">💧 Comsumption <br> 0 m³</div>
                <div class="scorecard" id="total-price">💰 Total Charges <br> $0</div>
                <div class="scorecard" id="price-per-unit">📏 Price/m³ <br> $0</div>   
            </div>
            <div style="height: 20px;"></div>
            <div id="LineChart1"></div>
            <div id="LineChart2"></div>
        </div>
    </div> 

    <div class="MetricChoice">
        <label><input type="radio" name="option" value="Consumption" checked> Consumption</label>
        <label><input type="radio" name="option" value="Charges"> Charges</label>
    </div>

    <div style="height: 10px;"></div>

    <div class="container-flex2">
        <div id="areachart-container"></div>
        <div id="treemap-container"></div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
